<div class="my-orders-container">
  <div class="card">
    <div class="card-header">
      <h4>{{"MY_ORDERS" | translate}}</h4>
    </div>
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-bordered table-hover">
          <thead class="thead-light">
            <tr>
              <th>{{"ORDER_ID" | translate}}</th>
              <th>{{"DATE" | translate}}</th>
              <th>{{"TOTAL" | translate}}</th>
              <th>{{"STATUS" | translate}}</th>
              <th>{{"ACTION" | translate}}</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let order of orders">
              <td>#{{order.id}}</td>
              <td>{{order.createdDate | date}}</td>
              <td>{{order.amount}} &euro;</td>
         <td> <span class="badge 
                    {{ order.status === 'READY_FOR_PICKUP' || order.status === 'DELIVERED'  ? 'badge-success' : 
                       order.status === 'CANCELED' ? 'badge-danger' : 
                       order.status === 'PROCESSING' ? 'badge-warning' : 
                       order.status === 'SHIPPED' ? 'badge-primary' :
                       'badge-secondary' }}">{{ order.status | translate}}</span></td>
              <td>
                <button class="btn btn-solid">{{"VIEW_DETAIL" | translate}}</button>
              </td>
            </tr>
            <tr *ngIf="orders.length === 0">
              <td colspan="5" class="text-center">No orders found</td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Pagination -->
      <div class="d-flex justify-content-between align-items-center">
        <div class="form-group mb-0">
          <select class="form-control form-control-sm" 
                  (change)="onItemsPerPageChange($event)">
            <option *ngFor="let option of pageSizeOptions" [value]="option">
              {{option}} items per page
            </option>
          </select>
        </div>

        <nav>
          <ul class="pagination mb-0">
            <li class="page-item" [class.disabled]="currentPage === 1">
              <a class="page-link" (click)="onPageChange(currentPage - 1)">Previous</a>
            </li>
            
            <li class="page-item" *ngFor="let page of [].constructor(totalPages); let i = index" 
                [class.active]="currentPage === i + 1">
              <a class="page-link" (click)="onPageChange(i + 1)">{{i + 1}}</a>
            </li>
            
            <li class="page-item" [class.disabled]="currentPage === totalPages">
              <a class="page-link" (click)="onPageChange(currentPage + 1)">Next</a>
            </li>
          </ul>
        </nav>
      </div>
    </div>
  </div>
</div>
